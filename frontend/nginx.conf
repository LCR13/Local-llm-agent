server {
    listen 80;


    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /chat {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /history {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    
    location /reset {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}